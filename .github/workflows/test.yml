name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      collab_preflight:
        description: Run collab-preflight against NEURAL_JUNKIE_HUB_URL (optional)
        type: boolean
        default: false

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '24'

jobs:
  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri v2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: make test-all
        run: make test-all

      - name: make test-race
        run: make test-race

      - name: Check Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Test Tauri shell
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  collab-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.collab_preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: collab-preflight (hub must be reachable from runner)
        env:
          NEURAL_JUNKIE_HUB_URL: ${{ vars.NEURAL_JUNKIE_HUB_URL }}
        run: |
          if [ -z "$NEURAL_JUNKIE_HUB_URL" ]; then
            echo "Set repository variable NEURAL_JUNKIE_HUB_URL to a reachable regression hub"
            exit 1
          fi
          python3 scripts/collab-preflight.py
