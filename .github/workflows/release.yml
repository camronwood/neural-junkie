name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '24'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        id: changelog
        run: |
          chmod +x ./scripts/extract-changelog-section.sh
          if body="$(./scripts/extract-changelog-section.sh "${{ github.ref_name }}")"; then
            {
              echo "body<<EOF"
              echo "${body}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "body=_No changelog section found for this tag — see docs/CHANGELOG.md._" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Neural Junkie ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          draft: true
          make_latest: false
          generate_release_notes: false
          body: |
            ## Install Neural Junkie

            Pick the installer for your platform:

            | Platform | File |
            |----------|------|
            | **macOS (Apple Silicon)** | `.dmg` with `aarch64` in the name |
            | **macOS (Intel)** | `.dmg` with `x64` or `x86_64` in the name |
            | **Windows** | `.msi` installer (or `.exe` setup) |
            | **Linux** | `.deb` (x86_64) |

            **Auto-update:** Installed builds from this release (and later) check for updates in-app. Beta builds use the beta channel; stable builds use the stable channel. One manual install is required if you are upgrading from a build that predates in-app updates.

            **macOS:** Official release builds are **Developer ID signed and notarized** when Apple CI secrets are configured. Without those secrets, builds are ad-hoc signed — first launch may require right-click → **Open**.

            **Ollama:** macOS bundles the runtime. Windows and Linux use slim installers — setup wizard auto-installs Ollama on first launch (internet required). All platforms need a one-time model pull. Cloud APIs remain optional.

            **Quick start:** [docs/DOWNLOAD.md](https://github.com/camronwood/neural-junkie/blob/main/docs/DOWNLOAD.md)

            **From source:** [README Quick Start](https://github.com/camronwood/neural-junkie#quick-start)

            ## What's new

            ${{ steps.changelog.outputs.body }}

  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: make test-all
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          retry_on: error
          command: make test-all
        env:
          HF_CATALOG_NETWORK: '0'

      - name: make test-race
        run: make test-race

  build-macos:
    needs:
      - create-release
      - test-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Write Slack vendor OAuth (Connect Slack in installers)
        env:
          SLACK_VENDOR_CLIENT_ID: ${{ secrets.SLACK_VENDOR_CLIENT_ID }}
          SLACK_VENDOR_CLIENT_SECRET: ${{ secrets.SLACK_VENDOR_CLIENT_SECRET }}
          SLACK_VENDOR_APP_TOKEN: ${{ secrets.SLACK_VENDOR_APP_TOKEN }}
          SLACK_VENDOR_OAUTH_RELAY_BASE: ${{ secrets.SLACK_VENDOR_OAUTH_RELAY_BASE }}
        run: chmod +x scripts/ci-write-slack-vendor-oauth.sh && ./scripts/ci-write-slack-vendor-oauth.sh

      - name: Write Google vendor OAuth (Connect Google in installers)
        env:
          GOOGLE_VENDOR_CLIENT_ID: ${{ secrets.GOOGLE_VENDOR_CLIENT_ID }}
          GOOGLE_VENDOR_CLIENT_SECRET: ${{ secrets.GOOGLE_VENDOR_CLIENT_SECRET }}
        run: chmod +x scripts/ci-write-google-vendor-oauth.sh && ./scripts/ci-write-google-vendor-oauth.sh

      - name: Prepare release build config
        run: chmod +x scripts/ci-prepare-release-build.sh && ./scripts/ci-prepare-release-build.sh "${{ github.ref_name }}"

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: chmod +x scripts/ci-import-apple-certificate.sh && ./scripts/ci-import-apple-certificate.sh

      - name: Configure macOS code signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: chmod +x scripts/ci-set-macos-signing-identity.sh && ./scripts/ci-set-macos-signing-identity.sh

      - name: Cross-compile Go server
        run: |
          mkdir -p desktop/src-tauri/binaries
          GOOS=darwin GOARCH=arm64 go build -tags "slackvendor googlevendor" -o desktop/src-tauri/binaries/nj-server-aarch64-apple-darwin ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -tags "slackvendor googlevendor" -o desktop/src-tauri/binaries/nj-server-x86_64-apple-darwin ./cmd/server

      - name: Fetch bundled Ollama (macOS)
        run: chmod +x scripts/fetch-ollama.sh && ./scripts/fetch-ollama.sh aarch64-apple-darwin x86_64-apple-darwin

      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Build Tauri (Apple Silicon)
        working-directory: desktop
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export APPLE_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          npx tauri build --target aarch64-apple-darwin

      - name: Notarize Apple Silicon artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/notarize-macos-artifacts.sh
          shopt -s nullglob
          apps=(desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          dmgs=(desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#apps[@]} -gt 0 || ${#dmgs[@]} -gt 0 ]]; then
            ./scripts/notarize-macos-artifacts.sh "${apps[@]}" "${dmgs[@]}"
          fi

      - name: Verify Apple Silicon updater artifacts
        run: bash scripts/verify-updater-artifacts.sh macos-aarch64 desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos

      - name: Verify Apple Silicon app signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/verify-macos-bundle-signature.sh desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Prepare Apple Silicon updater upload names
        run: chmod +x scripts/prepare-macos-updater-upload.sh && ./scripts/prepare-macos-updater-upload.sh desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos aarch64

      - name: Upload Apple Silicon assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.ref_name }}" \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Neural.Junkie_aarch64.app.tar.gz \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Neural.Junkie_aarch64.app.tar.gz.sig \
            --repo "${{ github.repository }}" --clobber

      - name: Build Tauri (Intel)
        working-directory: desktop
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export APPLE_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          npx tauri build --target x86_64-apple-darwin

      - name: Notarize Intel artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/notarize-macos-artifacts.sh
          shopt -s nullglob
          apps=(desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app)
          dmgs=(desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#apps[@]} -gt 0 || ${#dmgs[@]} -gt 0 ]]; then
            ./scripts/notarize-macos-artifacts.sh "${apps[@]}" "${dmgs[@]}"
          fi

      - name: Verify Intel updater artifacts
        run: bash scripts/verify-updater-artifacts.sh macos-x86_64 desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos

      - name: Verify Intel macOS app signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/verify-macos-bundle-signature.sh desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

      - name: Prepare Intel updater upload names
        run: chmod +x scripts/prepare-macos-updater-upload.sh && ./scripts/prepare-macos-updater-upload.sh desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos x64

      - name: Upload Intel macOS assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.ref_name }}" \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Neural.Junkie_x64.app.tar.gz \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Neural.Junkie_x64.app.tar.gz.sig \
            --repo "${{ github.repository }}" --clobber

  build-windows:
    needs:
      - create-release
      - test-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Write Slack vendor OAuth (Connect Slack in installers)
        shell: bash
        env:
          SLACK_VENDOR_CLIENT_ID: ${{ secrets.SLACK_VENDOR_CLIENT_ID }}
          SLACK_VENDOR_CLIENT_SECRET: ${{ secrets.SLACK_VENDOR_CLIENT_SECRET }}
          SLACK_VENDOR_APP_TOKEN: ${{ secrets.SLACK_VENDOR_APP_TOKEN }}
          SLACK_VENDOR_OAUTH_RELAY_BASE: ${{ secrets.SLACK_VENDOR_OAUTH_RELAY_BASE }}
        run: chmod +x scripts/ci-write-slack-vendor-oauth.sh && ./scripts/ci-write-slack-vendor-oauth.sh

      - name: Write Google vendor OAuth (Connect Google in installers)
        shell: bash
        env:
          GOOGLE_VENDOR_CLIENT_ID: ${{ secrets.GOOGLE_VENDOR_CLIENT_ID }}
          GOOGLE_VENDOR_CLIENT_SECRET: ${{ secrets.GOOGLE_VENDOR_CLIENT_SECRET }}
        run: chmod +x scripts/ci-write-google-vendor-oauth.sh && ./scripts/ci-write-google-vendor-oauth.sh

      - name: Prepare release build config
        shell: bash
        run: chmod +x scripts/ci-prepare-release-build.sh && ./scripts/ci-prepare-release-build.sh "${{ github.ref_name }}" windows

      - name: Cross-compile Go server
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          GOOS=windows GOARCH=amd64 go build -tags "slackvendor googlevendor" -o desktop/src-tauri/binaries/nj-server-x86_64-pc-windows-msvc.exe ./cmd/server

      - name: Prepare slim Windows bundle (no bundled Ollama)
        shell: bash
        run: chmod +x scripts/ci-prepare-windows-slim-bundle.sh && ./scripts/ci-prepare-windows-slim-bundle.sh

      - name: Build frontend and Tauri
        working-directory: desktop
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build
          npx tauri build

      - name: Verify Windows updater artifacts
        shell: bash
        run: bash scripts/verify-updater-artifacts.sh windows desktop/src-tauri/target/release/bundle/msi

      - name: Upload Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip.sig
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Windows bundles found" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${assets[@]}" --repo "${{ github.repository }}" --clobber

  build-linux:
    needs:
      - create-release
      - test-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            wget \
            squashfs-tools

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Write Slack vendor OAuth (Connect Slack in installers)
        env:
          SLACK_VENDOR_CLIENT_ID: ${{ secrets.SLACK_VENDOR_CLIENT_ID }}
          SLACK_VENDOR_CLIENT_SECRET: ${{ secrets.SLACK_VENDOR_CLIENT_SECRET }}
          SLACK_VENDOR_APP_TOKEN: ${{ secrets.SLACK_VENDOR_APP_TOKEN }}
          SLACK_VENDOR_OAUTH_RELAY_BASE: ${{ secrets.SLACK_VENDOR_OAUTH_RELAY_BASE }}
        run: chmod +x scripts/ci-write-slack-vendor-oauth.sh && ./scripts/ci-write-slack-vendor-oauth.sh

      - name: Write Google vendor OAuth (Connect Google in installers)
        env:
          GOOGLE_VENDOR_CLIENT_ID: ${{ secrets.GOOGLE_VENDOR_CLIENT_ID }}
          GOOGLE_VENDOR_CLIENT_SECRET: ${{ secrets.GOOGLE_VENDOR_CLIENT_SECRET }}
        run: chmod +x scripts/ci-write-google-vendor-oauth.sh && ./scripts/ci-write-google-vendor-oauth.sh

      - name: Prepare release build config
        run: chmod +x scripts/ci-prepare-release-build.sh && ./scripts/ci-prepare-release-build.sh "${{ github.ref_name }}"

      - name: Cross-compile Go server
        run: |
          mkdir -p desktop/src-tauri/binaries
          GOOS=linux GOARCH=amd64 go build -tags "slackvendor googlevendor" -o desktop/src-tauri/binaries/nj-server-x86_64-unknown-linux-gnu ./cmd/server

      - name: Prepare slim Linux bundle (no bundled Ollama)
        run: chmod +x scripts/ci-prepare-linux-slim-bundle.sh && ./scripts/ci-prepare-linux-slim-bundle.sh

      - name: Build frontend and Tauri (deb)
        working-directory: desktop
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          npm ci
          npm run build
          npx tauri build --bundles deb

      - name: Upload Linux deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          debs=(desktop/src-tauri/target/release/bundle/deb/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "No .deb found after build" >&2
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${debs[@]}" --repo "${{ github.repository }}" --clobber
          echo "Uploaded: ${debs[*]}"

  publish-updater-manifests:
    needs:
      - create-release
      - build-macos
      - build-windows
      - build-linux
    if: ${{ needs.create-release.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: chmod +x scripts/publish-updater-manifests.sh && ./scripts/publish-updater-manifests.sh "${{ github.ref_name }}" "${{ github.repository }}"

  publish-release:
    needs:
      - create-release
      - build-macos
      - build-windows
      - build-linux
      - publish-updater-manifests
    if: ${{ needs.create-release.result == 'success' && needs.publish-updater-manifests.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--draft=false)
          if [[ "${{ github.ref_name }}" == *beta* ]]; then
            args+=(--prerelease)
          fi
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" "${args[@]}"
