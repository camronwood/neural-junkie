id: web-browser
version: "2.1.0"
title: Web browser
description: Fetch URL, web search, HTML preview workbench, and Playwright QA (screenshots, a11y, visual diff, perf) — tools on Assistant when enabled.
layout_profile: team
capabilities:
  - web-browser
  - web-preview
  - web-browser-workbench
  - browser-sidecar
  - browser-evidence-canvas
capability_defs:
  web-browser:
    kind: mcp-tools
    label: Web browser
    description: Fetch, inspect, preview, and verify web experiences.
    exposure: safe
    mcp_agents:
      - assistant
    mcp_tools:
      - browser_screenshot
      - browser_navigate
      - browser_click
      - browser_fill
      - browser_a11y_audit
      - browser_metrics
  browser-sidecar:
    kind: hub-sidecar
    routes:
      - /api/browser
    sidecar:
      module: assets/hub/routes/browser.py
    settings:
      - playwright_browsers_path
      - browser_headless
      - browser_baseline_dir
      - python_executable
  browser-evidence-canvas:
    kind: artifact-renderer
    renderer: nj.image
    media_types:
      - image/png
      - image/jpeg
    match_glob: "**/*.{png,jpg,jpeg}"
    renderer_api_version: 1
    schema_version_min: 1
    schema_version_max: 1
    fallback: nj.code
requires_packs:
  - software-development
mcp_agents:
  - assistant
settings_overlay:
  playwright_browsers_path: ~/.neural-junkie/browser/playwright-browsers
  browser_headless: true
  browser_baseline_dir: .nj/browser-baselines
  python_executable: ~/.neural-junkie/browser/venv/bin/python3
assets:
  workspace_guide: assets/WORKSPACE.md
