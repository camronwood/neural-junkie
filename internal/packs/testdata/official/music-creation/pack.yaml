id: music-creation
version: "2.1.0"
title: Music creation
description: Lyrics via Ollama, ACE-Step 1.5 sidecar, music workbench, stems export, and EP workflow — tools on Assistant when enabled.
layout_profile: team
capabilities:
  - music-generation
  - music-workbench
  - music-sidecar
  - music-canvas
capability_defs:
  music-generation:
    kind: mcp-tools
    label: Music generation
    description: Generate music, lyrics, stems, and project artifacts.
    exposure: safe
    mcp_agents:
      - assistant
    mcp_tools:
      - generate_music
      - extract_stems
  music-sidecar:
    kind: hub-sidecar
    routes:
      - /api/music
    sidecar:
      module: assets/hub/routes/music.py
    settings:
      - ace_step_venv
      - ace_step_project
      - ace_step_checkpoint
      - ace_step_model_variant
      - ace_step_inference_steps
      - ace_step_guidance_scale
      - ace_step_infer_method
      - ace_step_default_seed
      - music_output_dir
      - music_project_dir
      - bundled_turbo_checkpoint
      - enable_midi_export
      - python_executable
  music-canvas:
    kind: artifact-renderer
    renderer: nj.music
    media_types:
      - application/vnd.neural-junkie.music+json
      - audio/wav
      - audio/mpeg
    match_glob: "**/*.{nj-music.json,wav,mp3}"
    renderer_api_version: 1
    schema_version_min: 1
    schema_version_max: 1
    fallback: nj.code
mcp_agents:
  - assistant
settings_overlay:
  ace_step_venv: ~/.neural-junkie/music/acestep-venv
  ace_step_project: ~/.neural-junkie/music/ACE-Step-1.5
  ace_step_checkpoint: ~/.neural-junkie/music/checkpoints/acestep-v15-turbo
  ace_step_model_variant: turbo
  music_output_dir: ~/.neural-junkie/music/output
  music_project_dir: music
  bundled_turbo_checkpoint: assets/checkpoints/acestep-v15-turbo
  enable_midi_export: false
  python_executable: python3
assets:
  workspace_guide: assets/WORKSPACE.md
  runbooks: assets/runbooks/
  templates: assets/templates/
