id: incident-management
version: "2.0.0"
title: Incident management
description: IncidentManager — multi-provider ticketing, severity rubric, handoff runbooks, stack trace ingestion, and postmortem workflows.
layout_profile: team
capabilities:
  - incident-api
  - incident-triage
  - jira-integration
  - github-issues-integration
  - linear-integration
  - pagerduty-integration
  - sentry-integration
  - incident-sidecar
  - incident-timeline-canvas
requires_packs:
  - software-development
capability_defs:
  incident-api:
    kind: mcp-tools
    label: Incident management
    description: Ticketing, on-call, triage, and gated incident operations.
    exposure: sensitive
    mcp_agents:
      - incident
  incident-sidecar:
    kind: hub-sidecar
    routes:
      - /api/incident
    sidecar:
      module: assets/hub/server.py
    settings:
      - incident_default_provider
      - incident_write_mode
      - incident_require_approval
  incident-timeline-canvas:
    kind: artifact-renderer
    renderer: nj.timeline
    media_types: [application/vnd.neural-junkie.timeline+json]
    renderer_api_version: 1
    schema_version_min: 1
    schema_version_max: 1
    fallback: nj.markdown
agents:
  - type: incident
    name: IncidentManager
    implementation: builtin/incident
    ollama_model: qwen2.5-coder:14b
    compose:
      tool_model: qwen3.5:9b
      consult_triggers:
        - bug
        - incident
        - ticket
        - regression
        - sentry
        - stack trace
        - jira
        - postmortem
        - pagerduty
        - on-call
        - severity
        - p0
models_to_ensure:
  - qwen2.5-coder:14b
  - qwen3.5:9b
expert_slug: incident
expert_label: Incident / Bug triage
mcp_agents:
  - incident
settings_overlay:
  incident_default_provider: jira
  incident_write_mode: "false"
  incident_require_approval: "true"
assets:
  workspace_guide: assets/WORKSPACE.md
  runbooks_glob: assets/runbooks/*.md
  runbook_templates_glob: assets/runbook-templates/*.json
  severity_rubric: assets/severity-rubric.md
