id: customer-lab-pack
version: "1.0.4"
title: Lab data pack (test fixture)
description: >-
  Phoenix TIM import, scan summary/analysis viewers, validation siblings, 12-Plex QC, and
  multi-plate secondary analysis. Requires Life sciences for BiologyExpert (sequence, fold).
publisher: Example Customer
pack_kind: customer
layout_profile: team
capabilities:
  - customer-pack
  - phoenix-import
  - scan-summary-api
  - scan-summary-viewer
  - scan-analysis-viewer
  - secondary-analysis-api
  - secondary-analysis-viewer
  - secondary-analysis-python
capability_defs:
  phoenix-import:
    kind: hub-sidecar
    routes:
      - /api/phoenix
    sidecar:
      module: assets/hub/routes/phoenix.py
    ui:
      toolbar:
        id: phx
        label: PHX
      modal: phoenix-import
    settings:
      - phoenix_environment
      - phoenix_auth_config_path
      - phoenix_credentials_path
  scan-summary-api:
    kind: hub-sidecar
    routes:
      - /api/scan-summary
    sidecar:
      module: assets/hub/routes/scan_summary.py
  scan-summary-viewer:
    kind: file-viewer
    match_glob: "**/scan-export/imageMetadata.json"
    viewer: nj.scan-summary
  scan-analysis-viewer:
    kind: file-viewer
    match_glob: "**/reports/results.json"
    viewer: nj.scan-analysis
  secondary-analysis-api:
    kind: hub-sidecar
    routes:
      - /api/secondary-analysis
    sidecar:
      module: assets/hub/routes/secondary_analysis.py
    settings:
      - secondary_analysis_tools_path
      - python_executable
      - default_panel_profile
      - cumulative_qc_dir
  secondary-analysis-viewer:
    kind: file-viewer
    match_glob: "**/reports/results.json"
    viewer: nj.scan-analysis
  secondary-analysis-python:
    kind: mcp-tools
    mcp_tools_path: assets/secondary-analysis-tools
    settings:
      - secondary_analysis_tools_path
      - python_executable
requires_packs:
  - life-sciences
settings_overlay:
  phoenix_environment: dev
  phoenix_auth_config_path: /Users/camronwood/development/phoenix-tim-test-suite/.phoenix-customer-cli-creds
  python_executable: python3
  secondary_analysis_tools_path: assets/secondary-analysis-tools
  default_panel_profile: human-inflammatory-12plex-v1
assets:
  workspace_guide: assets/WORKSPACE.md
  runbooks_glob: assets/runbooks/*.md
  # Full JSON runbook definitions (customer-owned; not loaded by core app unless sideloaded):
  # assets/runbook-templates/*.json
