id: software-development
version: "1.0.0"
title: Software development
description: Broad backend, frontend, platform, security, architecture, and code review specialists with MCP analysis tools and Qwen Coder models.
layout_profile: ide
capabilities:
  - ide-v2
  - ide-v3-composer
  - git-rest
  - inline-completion
agents:
  - type: backend
    name: BackendEngineer
    implementation: builtin/backend
  - type: frontend
    name: FrontendEngineer
    implementation: builtin/frontend
  - type: devops
    name: PlatformEngineer
    implementation: builtin/devops
  - type: security
    name: SecurityReviewer
    implementation: builtin/security
    compose:
      tool_model: qwen3.5:9b
      lora_tag: nj-security:14b
      consult_triggers:
        - security
        - auth
        - oauth
        - jwt
        - cve
  - type: architecture
    name: SoftwareArchitect
    implementation: builtin/architecture
  - type: code-review
    name: CodeReviewer
    implementation: builtin/code-review
  - type: database
    name: DatabaseSpecialist
    implementation: builtin/database
models_to_ensure:
  - qwen3.5:9b
ollama_model: qwen3.5:9b
expert_presets:
  - slug: backend
    label: Backend
  - slug: frontend
    label: Frontend
  - slug: devops
    label: Platform / DevOps
  - slug: security
    label: Security
  - slug: architecture
    label: Software Architecture
  - slug: code-review
    label: Code Review
  - slug: database
    label: Database
mcp_agents:
  - backend
  - devops
  - database
  - frontend
  - security
  - code-review
  - architecture
